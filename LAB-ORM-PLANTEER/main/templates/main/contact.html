{% extends 'main/base.html' %}

{% block title %}Contact | Planteer{% endblock %}

{% block content %}
<section class="container section-block">
    <div class="form-card">
        <h2>Contact Us</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-primary">Send Message</button>
        </form>
    </div>
</section>
{% endblock %}
