{%extends 'main/base.html'%}
{% load static %}

{% block title %}All Plants{%endblock%}


{% block content %}

<div class="main-content">
    <div class="more-main">
    <h2>Plants</h2>
    </div>

    <form method="get" class="row g-3 mb-4">

    <div class="col-md-4">
        <label class="form-label">Category</label>
        <select name="category" class="form-select">
            <option value="">All</option>
          {% for value, label in categories %}
                <option value="{{ value }}" {% if request.GET.category == value %}selected{% endif %}>
                {{ label }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="col-md-4">
        <label class="form-label">Edible</label>
        <select name="is_edible" class="form-select">
            <option value="">All</option>
            <option value="true" {% if request.GET.is_edible == 'true' %}selected{% endif %}>Yes</option>
            <option value="false" {% if request.GET.is_edible == 'false' %}selected{% endif %}>No</option>
        </select>
    </div>

    <div class="col-md-4 d-flex align-items-end">
        <button type="submit" class="btn btn-filter">Filter</button>
    </div>

</form>

    <!--card-->
        <div class="row g-4">
{% for plant in plants %}
  <div class="col-md-6">
    <div class="card h-100">
      <div class="row g-0">
        <div class="col-md-4">
            <img src="{{ plant.image.url }}" class="plant-img">
        </div>
        <div class="col-md-8">
          <div class="card-body">
            <h5 class="card-title">{{ plant.name_plant }}</h5>
            <p class="card-text">{{ plant.category }}</p>
            <p class="card-text">
              <small class="text-body-secondary">{{ plant.created_at }}</small>
            </p>
            <a href="{% url 'plants:plant_detail_view' plant.id %}" class="btn btn-main">Read More</a>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endfor %}
</div>

</div>



{% endblock %}
