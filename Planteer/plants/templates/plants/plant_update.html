{% extends 'main/base.html' %}
{% load static %}

{% block title %}Update Plant{% endblock %}

{% block content %}

<h3>Update Plants</h3>

{% if plant_form.errors %}
<div class="alert alert-danger">
    {{ plant_form.errors }}
</div>
{% endif %}

<form action="{% url 'plants:plant_update_view' plant.id %}" method="post" enctype="multipart/form-data" class="form-section">
    {% csrf_token %}

    <section class="lt-side">

        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Plant Name</label>
                <input type="text" name="name_plant" class="form-control" placeholder="Enter plant name" required minlength="3" value="{{plant.name_plant}}">
            </div>

            <div class="col-md-6">
                <label class="form-label">Used For</label>
                <input type="text" name="used_for" class="form-control" placeholder="e.g. decoration, cooking" required value="{{plant.used_for}}">
            </div>
        </div>

        <div class="col-12">
            <label class="form-label">About the Plant</label>
            <textarea name="about" class="form-control" rows="6" placeholder="Write a short description about the plant" required >{{plant.about}}</textarea>
        </div>
        <div class="col-12">
            <label class="form-label">Category</label>

            <select class="form-select" name="category" required>
                {% for val, label in CategoryChoices %}
                    <option value="{{ val }}"
                        {% if plant.category == val %}selected{% endif %}>
                        {{ label }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <label class="form-label">Countries</label>

        <div class="d-flex flex-wrap gap-3">
            {% for country in countries %}
                <label for="check-{{ country.id }}" class="d-flex align-items-center gap-2">

                    <input type="checkbox"
                        name="countries"
                        id="check-{{ country.id }}"
                        value="{{ country.id }}"
                        class="form-check-input"

                        {% if country in plant.countries.all %}
                            checked
                        {% endif %}
                    >

                    <img src="{{ country.flag.url }}" width="25" style="border-radius:4px;">

                    <span>{{ country.name }}</span>

                </label>
            {% endfor %}
        </div>

        <div class="col-12 ">
            <label class="form-label">Is it edible?</label>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="is_edible" value="True"
                    {% if plant.is_edible %}checked{% endif %}>
                <label class="form-check-label">Yes</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="is_edible" value="False"
                    {% if not plant.is_edible %}checked{% endif %}>
                <label class="form-check-label">No</label>
            </div>
        </div>

        <div class="col-12 ">
            <input type="submit" class="btn btn-success" value="Update Plant">
        </div>

    </section>

    <section class="rt-side">

        <label class="upload-box">
            Upload The image
            <input type="file" name="image" id="imageInput" accept="image/*">
        </label>

        <img id="previewImage">

    </section>

</form>

{% endblock %}
