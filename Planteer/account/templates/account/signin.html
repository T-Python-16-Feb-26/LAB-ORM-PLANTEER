{%extends 'main/base.html'%}
{% load static %}

{% block title %}Sign in Page{%endblock%}


{% block content %}
<div class="text-center justify-content-center col sign-style" >
    <h3 class="mb-3 ">Welcome back to Flora 🌿</h3>
    <div class="d-flex justify-content-center align-items-center">
    
        <div class="card shadow-sm p-5" style="width: 500px;">
            <form action="{%url 'account:sign_in_view'%}" method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Username" name="username">
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" placeholder="Password" name="password">
                </div>

                <div class="mt-5">
                    <button type="submit" class="btn custom-btn w-100">
                        Sign in
                    </button>   
                </div>

            </form>
            <p class="mt-4"> Don't have an account?  <a href="{%url 'account:sign_up_view'%}" >Sign up</a></p>

        </div>
</div>

</div>

{% endblock %}
