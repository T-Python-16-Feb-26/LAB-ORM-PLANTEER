{%extends 'main/base.html'%}
{% load static %}


{% block title %}All Messages{%endblock%}
{% block content %}

    <h1>Messages</h1>

    <div class="row g-5">
     {% for message in messages %}
    
    <div class="col-md-6">  <!-- هذا المهم -->
        <div class="card h-100">
            <div class="card-body">
                <h5 class="card-title text-success">{{message.first_name}} {{message.last_name}}</h5>
                <p class="card-text text-primary">{{message.email}}</p>
                <p class="card-text text-secondary">{{message.message}}</p>
                <p class="card-text">
                    <small class="text-body-secondary">{{message.created_at}}</small>
                </p>
            </div>
        </div>
    </div>

    {% endfor %}
</div>




{% endblock %}
