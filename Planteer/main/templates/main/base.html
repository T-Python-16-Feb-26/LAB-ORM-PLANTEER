{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Carter+One&family=Germania+One&family=Shadows+Into+Light&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    

    <title>{% block title %}{%endblock%}</title>
</head>

<body>

<div class="page-wrapper">

    <div class="container mt-5">


        <nav class="nav-bar">
            <div class="logo-box">
                <div class="logo"><span>F</span></div>
               <a href="{%url  'main:home_view'%}"> Flora</a>
            </div>

            <ul class="nav nav-pills">
                <li>
                    <a class="nav-link" href="#">All Plants</a>
                </li>
                <li>
                    <a class="nav-link" href="{% url 'main:Contact_us_view'%}">Contact Us</a>
                </li>
                <li>
                    <a class="nav-link custom-btn" href="{% url 'plants:add_plant_view'%}">Add Plant</a>
                </li>
            </ul>
        </nav>

        <header>
            {% block header-content %}
            {% endblock %}
        </header>


        <main>
            {% block content %}
            {% endblock %}
        </main>

    </div>


    <footer class="footer">
        <div class="container">
            <hr>
            <div class="text-center p-3">
                <h3>Flora</h3>
                <p>© 2026 All rights reserved</p>
            </div>
        </div>
    </footer>

</div>
<script src="{% static 'js/main.js' %}"></script>
</body>
</html>
